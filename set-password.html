<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password | New Bridges ABA</title>

    <!-- Scripts -->
    <script src="/vendor/tailwindcss.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPurple: '#4A2B7A',
                        brandOrange: '#FDBF0F',
                        brandLightPurple: '#926BBE',
                        brandBeige: '#FDF8F0',
                    },
                    fontFamily: { sans: ['Onest', 'sans-serif'] }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <style>
        body { font-family: 'Onest', sans-serif; }
    </style>
</head>
<body class="bg-brandBeige min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <div class="text-center mb-8">
            <img src="/images/new-bridges-aba-logo.png" alt="New Bridges ABA" class="h-12 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-brandPurple">Set Your Password</h1>
            <p class="text-gray-600 mt-2 text-sm">Create a password for your account.</p>
        </div>

        <form id="set-password-form" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    readonly
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-100 text-gray-600 cursor-not-allowed focus:outline-none"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandPurple focus:border-brandPurple focus:outline-none"
                    placeholder="Enter your password"
                >
            </div>

            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    required
                    minlength="8"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandPurple focus:border-brandPurple focus:outline-none"
                    placeholder="Confirm your password"
                >
            </div>

            <div id="error-message" class="hidden text-red-600 text-sm text-center"></div>
            <div id="success-message" class="hidden text-green-600 text-sm text-center"></div>

            <button
                type="submit"
                id="submit-btn"
                class="w-full bg-brandPurple text-white font-semibold py-3 rounded-lg hover:bg-brandLightPurple transition-colors duration-200"
            >
                Set Password
            </button>
        </form>
    </div>

    <script>
        (function() {
            // Prefill email from URL parameter
            const params = new URLSearchParams(window.location.search);
            const email = params.get('email');
            const emailInput = document.getElementById('email');

            if (email) {
                emailInput.value = email;
            }

            const form = document.getElementById('set-password-form');
            const errorMsg = document.getElementById('error-message');
            const successMsg = document.getElementById('success-message');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Reset messages
                errorMsg.classList.add('hidden');
                successMsg.classList.add('hidden');

                const emailValue = emailInput.value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                // Validation
                if (!emailValue) {
                    showError('Email is required. Please use the link provided to you.');
                    return;
                }

                if (password.length < 8) {
                    showError('Password must be at least 8 characters.');
                    return;
                }

                if (password !== confirmPassword) {
                    showError('Passwords do not match.');
                    return;
                }

                // Disable button while processing
                submitBtn.disabled = true;
                submitBtn.textContent = 'Setting password...';

                try {
                    const { data, error } = await window.supabaseAuth.signUp({
                        email: emailValue,
                        password: password
                    });

                    if (error) {
                        showError(error.message);
                    } else {
                        successMsg.textContent = 'Password set successfully! You can now log in with your credentials.';
                        successMsg.classList.remove('hidden');
                        form.reset();
                        emailInput.value = emailValue;
                    }
                } catch (err) {
                    showError('An unexpected error occurred. Please try again.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set Password';
                }
            });

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.remove('hidden');
            }
        })();
    </script>

</body>
</html>
